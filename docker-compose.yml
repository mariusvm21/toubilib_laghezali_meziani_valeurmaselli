networks:
  toubilib.net:
    driver: bridge

services:
  # service api.toubeelib : api pour la prise de rdv
  #
  api.toubilib:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    ports:
      - '7080:80'
    volumes:
      - ./app:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubilib.db

    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"


  toubilib.db:
    image: 'postgres:18.6'
    container_name: toubilib_db
    env_file: ./toubilib.env
    networks:
      toubilib.net:
        aliases:
          - sql.db
    volumes:
      - ./app/sql:/var/sql


  adminer:
    image: adminer:5.4.2
    depends_on:
      - toubilib.db
    ports:
      - '8080:8080'
    command: php -S 0.0.0.0:8080 -t /var/www/html
    networks:
      - toubilib.net